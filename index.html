<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}</style><script src="config.js"></script></head><body>
<title>광주 관망 모바일</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>

/* Layout: full-bleed pipe-network canvas, floating search on top, draggable result sheet at bottom (field-instrument feel) */
:root{
  /* GIS PIPE 화면 문법: 흰 지도 바탕, 검은 관로·절점, 반투명 빨강 선택 */
  --ground:#f2f0eb; --surface:#ffffff; --surface2:#f4f4f4; --ink:#1a1a1a; --muted:#666b70; --rule:#d0d0d0;
  --pipe:#141414; --pipe-major:#000000; --dong:#b8b2a6; --accent:#2b5fb4; --accent-ink:#ffffff;
  --cut:#d7263d; --low:#ef8a00; --ok:#1c9a4e; --open:#1c9a4e; --closed:#141414; --sel:rgba(222,52,64,.62); --sel-solid:#de3440;
  --shadow:0 2px 10px rgba(0,0,0,.18);
  --f-ui:"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  --f-data:"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--f-ui);font-size:14px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#map{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit}
.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}

/* top bar */
.top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:20}
.searchrow{display:flex;gap:8px;pointer-events:auto;max-width:560px;width:100%;margin:0 auto}
.search{flex:1;min-width:0;display:flex;align-items:center;background:var(--surface);border-radius:4px;box-shadow:var(--shadow);border:1px solid #bdbdbd;height:44px;padding:0 6px 0 12px;gap:6px}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:16px;outline:none}
.search input::placeholder{color:var(--muted)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:4px;background:var(--surface);border:1px solid var(--rule);box-shadow:var(--shadow);cursor:pointer}
.iconbtn svg,.search svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8}
.chips{display:flex;gap:6px;pointer-events:auto;max-width:560px;width:100%;margin:0 auto;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:3px;background:var(--surface);border:1px solid #bdbdbd;box-shadow:0 1px 4px rgba(0,0,0,.12);flex:none;font-size:13px;cursor:pointer;white-space:nowrap}
.chip select{border:0;background:transparent;color:var(--ink);font:inherit;font-family:var(--f-data);outline:none;padding:0;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.chip .dot.ready{background:var(--ok)} .chip .dot.busy{background:var(--low)} .chip .dot.fail{background:var(--cut)}
.results{pointer-events:auto;max-width:560px;width:100%;margin:0 auto;background:var(--surface);border:1px solid #bdbdbd;border-radius:4px;box-shadow:var(--shadow);max-height:52vh;overflow:auto}
.results button{display:flex;width:100%;text-align:left;gap:10px;align-items:baseline;padding:11px 14px;border:0;background:transparent;border-bottom:1px solid var(--rule);cursor:pointer}
.results button:last-child{border-bottom:0}
.results button:hover,.results button:focus-visible{background:var(--surface2);outline:none}
.results .kind{flex:none;font-size:11px;color:var(--muted);width:64px}
.results .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.results .sub{font-size:12px;color:var(--muted);flex:none}

/* legend */
.legend{position:fixed;right:12px;z-index:15;background:var(--surface);border:1px solid #bdbdbd;border-radius:3px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;max-width:46vw}
.legend .row{display:flex;align-items:center;gap:6px;min-width:0}
.legend .sw{width:16px;height:4px;border-radius:2px;flex:none}
.legend .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* fabs */
.fab{position:fixed;right:12px;z-index:15;display:flex;flex-direction:column;gap:8px}

/* context menu */
.ctx{position:fixed;z-index:40;background:var(--surface);border:1px solid #a8a8a8;border-radius:3px;box-shadow:var(--shadow);min-width:210px;overflow:hidden}
.ctx .hd{padding:10px 14px 8px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--rule)}
.ctx .hd b{color:var(--ink);font-weight:600}
.ctx button{display:flex;gap:10px;align-items:center;width:100%;padding:11px 14px;border:0;background:transparent;text-align:left;cursor:pointer;font-size:15px}
.ctx button:hover,.ctx button:focus-visible{background:#e5f0fb;outline:none}
.ctx .sw{width:10px;height:10px;border-radius:3px;flex:none}

/* sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top-left-radius:8px;border-top-right-radius:8px;border-top:1px solid #bdbdbd;box-shadow:0 -4px 18px rgba(0,0,0,.16);display:flex;flex-direction:column;max-width:720px;margin:0 auto;transition:height .22s ease;height:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.dragging{transition:none}
.grab{flex:none;padding:8px 16px 4px;cursor:grab;touch-action:none}
.grab i{display:block;width:40px;height:4px;border-radius:2px;background:var(--rule);margin:0 auto 8px}
.sh-head{display:flex;align-items:flex-start;gap:10px}
.sh-title{flex:1;min-width:0}
.sh-title h2{margin:0;font-size:17px;font-weight:600;text-wrap:balance}
.sh-title p{margin:2px 0 0;color:var(--muted);font-size:12.5px}
.xbtn{width:32px;height:32px;border-radius:3px;border:1px solid var(--rule);background:var(--surface2);display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none}
.sh-body{flex:1;overflow:auto;padding:4px 16px 20px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sh-body h3{font-size:12.5px;color:var(--ink);font-weight:700;margin:16px -16px 0;padding:6px 16px;background:#ececec;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.kv{display:grid;grid-template-columns:1fr 1fr;margin:0 -16px;border-bottom:1px solid #e3e3e3}
.kv div{display:grid;grid-template-columns:minmax(84px,44%) 1fr;min-width:0;border-top:1px solid #e3e3e3;align-items:center}
.kv span{font-size:12.5px;color:#333;background:#f6f6f6;padding:7px 8px 7px 16px;height:100%;display:flex;align-items:center;border-right:1px solid #e3e3e3}
.kv b{font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;overflow-wrap:anywhere;padding:7px 8px}
@media (max-width:520px){.kv{grid-template-columns:1fr}}
.kv b.t{font-family:var(--f-ui)}
.tbl{overflow-x:auto;margin:0 -16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:5px 8px;border-bottom:1px solid var(--rule);white-space:nowrap;background:#fafafa}
td{padding:7px 8px;border-bottom:1px solid #e3e3e3;vertical-align:top}
td.r,th.r{text-align:right}
td .num,td.num{font-family:var(--f-data);font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface2)}
tr.sel td{background:color-mix(in srgb,var(--ok) 14%,transparent)}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.tag.pump{border-color:#7b5cd6;color:#7b5cd6} .tag.prv{border-color:#c2410c;color:#c2410c} .tag.tcv{border-color:var(--ok);color:var(--ok)} .tag.res{border-color:var(--accent);color:var(--accent)} .tag.cut{border-color:var(--cut);color:var(--cut)}
.bar{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:3px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.seg{display:inline-flex;border:1px solid #b8b8b8;border-radius:3px;overflow:hidden;margin:10px 0 2px}.seg button{border:0;background:#fff;padding:7px 12px;font-size:13px;cursor:pointer}.seg button+button{border-left:1px solid #b8b8b8}.seg button.on{background:var(--accent);color:#fff}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{height:38px;padding:0 13px;border-radius:3px;border:1px solid #b8b8b8;background:linear-gradient(#fff,#f0f0f0);cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);font-size:14px}
.btn.pri{background:var(--accent);background-image:none;color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--cut);color:var(--cut)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,.chip:focus-visible,.iconbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.note{font-size:12.5px;color:var(--muted);line-height:1.55;margin:8px 0}
.callout{border-left:3px solid var(--accent);background:var(--surface2);padding:10px 12px;border-radius:0;margin:10px 0;font-size:13.5px;line-height:1.5}
.callout.warn{border-color:var(--low)} .callout.bad{border-color:var(--cut)} .callout.good{border-color:var(--ok)}
.list-ops{display:flex;flex-direction:column;gap:6px;margin:6px 0}
.op{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
.op .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op .st{font-size:12px;font-weight:600}
.op .st.c{color:var(--cut)} .op .st.o{color:var(--ok)}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row2 label{font-size:13px;color:var(--muted)}
.row2 select{height:36px;border-radius:3px;border:1px solid var(--rule);background:var(--surface2);color:var(--ink);font:inherit;padding:0 8px}
.prog{height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.editbar{position:fixed;left:50%;transform:translateX(-50%);z-index:25;background:var(--ink);color:var(--surface);padding:8px 8px 8px 14px;border-radius:4px;display:flex;gap:10px;align-items:center;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.editbar button{height:30px;border-radius:15px;border:0;background:var(--surface);color:var(--ink);padding:0 12px;cursor:pointer;font-weight:600}

/* loader */
.loader{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:var(--ground)}
.loader .box{width:min(320px,calc(100vw - 48px));display:flex;flex-direction:column;gap:10px}
.loader h1{font-size:20px;margin:0;font-weight:600}
.loader p{margin:0;color:var(--muted);font-size:13px}
.loader .prog{height:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:10px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100vw - 32px);text-align:center}
@media (prefers-reduced-motion: reduce){.sheet{transition:none}}

/* v3: 장(챕터) 탭, 초기화 버튼, 흐름 변화 재생기 */
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;border-bottom:1px solid var(--rule);padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:transparent;padding:9px 11px 8px;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}
.tabs button:disabled{opacity:.35;cursor:default}
.tabs button .n{display:inline-block;min-width:16px;padding:0 4px;margin-left:4px;border-radius:8px;background:var(--accent);color:#fff;font-size:11px;line-height:16px;text-align:center}
.iconbtn.reset{color:var(--cut);border-color:#d9a0a6}
.card{border:1px solid var(--rule);border-radius:3px;margin:10px 0;overflow:hidden}
.card .hd{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f6f6f6;border-bottom:1px solid var(--rule)}
.card .hd b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .kv{margin:0}
.player{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.steps{display:flex;gap:0;border:1px solid #b8b8b8;border-radius:3px;overflow:hidden}
.steps button{flex:1;border:0;background:#fff;padding:9px 6px;font-size:13px;cursor:pointer;line-height:1.25}
.steps button+button{border-left:1px solid #b8b8b8}
.steps button.on{background:var(--accent);color:#fff}
.steps button small{display:block;font-size:11px;opacity:.8}
.banner{position:fixed;left:50%;transform:translateX(-50%);z-index:26;background:rgba(20,20,20,.86);color:#fff;padding:8px 14px;border-radius:4px;font-size:14px;font-weight:700;box-shadow:var(--shadow);text-align:center;max-width:calc(100vw - 32px)}
.banner small{display:block;font-weight:400;font-size:12px;opacity:.85}
.lg-inline{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.lg-inline span{display:inline-flex;align-items:center;gap:5px}
.lg-inline i{display:inline-block;width:18px;height:4px;border-radius:2px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0}

.iconbtn.gps-on{color:#fff;background:#1a73e8;border-color:#1a73e8}.iconbtn.gps-wait{color:#1a73e8}
.bigstat{display:flex;align-items:baseline;gap:6px;margin:4px 0 10px}.bigstat span{font-size:13px;color:var(--muted)}.bigstat b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}.bigstat em{font-style:normal;font-size:14px;color:var(--muted)}
.opcard{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--surface)}
.ophead{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
.opstep{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}.opstep:first-of-type{border-top:0}
.opstep .no{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.opstep.x .no{background:#d92b2b}.opstep.o .no{background:#14995a}
.opstep .act{font-weight:800;font-size:14px;flex:none;min-width:30px}.opstep.x .act{color:#d92b2b}.opstep.o .act{color:#14995a}
.opstep .nm{flex:1;min-width:0;display:flex;flex-direction:column}.opstep .nm b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.opstep .nm small{font-size:11.5px;color:var(--muted)}
.opres{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px}.opres b{font-size:16px}.opres small{color:var(--muted)}
.btn.mini{padding:3px 9px;font-size:12px;min-height:0;flex:none}
details.alt{margin:10px 0}details.alt summary{cursor:pointer;font-size:13px;color:var(--accent);padding:6px 0}
tr.sel td{background:rgba(20,153,90,.08)}

.here{pointer-events:none;align-self:flex-start;max-width:min(560px,calc(100vw - 24px));margin-left:max(0px,calc((100vw - 24px - 560px)/2));background:rgba(255,255,255,.88);border:1px solid rgba(0,0,0,.12);border-radius:6px;padding:5px 9px;box-shadow:0 1px 4px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:1px}
.here b{font-size:14px;font-weight:800;color:#1b1b1b;letter-spacing:-.2px}.here b small{font-weight:500;color:#555;font-size:12px;margin-left:5px}
.here span{font-size:11.5px;color:#1f5fbf;line-height:1.35}.here span:empty{display:none}
.ailog{display:flex;flex-direction:column;gap:6px;margin:4px 0 8px}
.msg{max-width:92%;padding:8px 10px;border-radius:10px;font-size:13.5px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:#1f5fbf;color:#fff;border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--surface2,#f1f1f1);border:1px solid var(--line);border-bottom-left-radius:3px}
.msg.t{align-self:flex-start;font-size:11.5px;color:var(--muted);padding:0 4px}
.aictx{font-size:12.5px;color:var(--muted);margin:6px 0 4px}.aictx b{color:#7b2cbf}
.aiin{display:flex;gap:6px;align-items:stretch;margin:4px 0}.aiin textarea{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border:1px solid #bdbdbd;border-radius:6px;resize:none}
.aiin .btn{flex:none}
.aiex{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.aiex .btn.mini{white-space:normal;text-align:left;height:auto;padding:6px 9px}
/* 모바일 한 화면 맞춤 */
.chips{overflow:visible}
.chip{flex:1 1 auto;justify-content:center;padding:0 8px;min-width:0}
.chip select{max-width:64px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);overflow:visible;padding:0 6px;margin:8px -16px 0}
.tabs button{padding:8px 2px 7px;font-size:13px;text-align:center;letter-spacing:-.3px}
@media (min-width:720px){.tabs{grid-template-columns:repeat(10,1fr)}}
@media (max-width:360px){.tabs button{font-size:12px}.chip{font-size:12.5px;padding:0 6px}}
/* 범례 */
.lgx{margin:6px 0 10px}.lgh{font-size:12px;font-weight:700;color:var(--muted);margin:4px 0}
.lgi{display:flex;align-items:center;gap:10px;padding:3px 0;font-size:13.5px}.lgi img{flex:none;border:1px solid #e3e3e3;border-radius:3px;background:#f2f0eb}
/* 물차·병물 */
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden;margin:4px 0 10px}.seg button{flex:1;border:0;background:var(--surface);padding:9px 4px;font-size:13.5px;cursor:pointer}.seg button.on{background:var(--accent);color:#fff;font-weight:700}.seg button:disabled{opacity:.4}
.wform{display:flex;flex-direction:column;gap:2px;margin:8px 0}
.wrow{display:grid;grid-template-columns:1fr 104px 42px;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid #eee;font-size:13.5px}
.wrow input,.wrow select{font:inherit;padding:6px 8px;border:1px solid #bdbdbd;border-radius:4px;text-align:right;width:100%;min-width:0}.wrow select{grid-column:2/4;text-align:left}
.wrow em{font-style:normal;color:var(--muted);font-size:12px}.wrow small{grid-column:1/4;color:var(--muted);font-size:11.5px;margin-top:-2px}
.wres{border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;background:#f5f7fb;border:1px solid #dfe6f1}
.wres.bad{background:#fdf3f2;border-color:#f3cfcb}.wres.good{background:#f1f9f4;border-color:#cde9d7}
.wres div{display:flex;flex-direction:column}.wres span{font-size:11.5px;color:var(--muted)}.wres b{font-size:16px}
.wres .wj{grid-column:1/3;font-weight:700;font-size:14px}.wres.bad .wj{color:#c62828}.wres.good .wj{color:#14995a}
.wres div:last-child{grid-column:1/3}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:12px}.modal[hidden]{display:none}
.mbox{background:#fff;border-radius:10px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:12px 14px}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}.mhd b{font-size:16px}
table.calc td{vertical-align:top;font-size:12.5px}table.calc td.f{font-family:var(--f-data,monospace);font-size:11.5px;color:#333}table.calc small{color:var(--muted)}

<script>
"use strict";
/* ============ utilities ============ */
const $=s=>document.querySelector(s);
const fmt=(v,d=0)=>v==null||isNaN(v)?"–":Number(v).toLocaleString("ko-KR",{maximumFractionDigits:d,minimumFractionDigits:d});
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const hh2=h=>String(h).padStart(2,"0");
let toastT=0;
function toast(msg,ms=2600){const t=$("#toast");t.textContent=msg;t.hidden=false;t.style.bottom=`calc(${sheetH()+16}px + env(safe-area-inset-bottom,0px))`;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms);}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem("gjnet."+k));localStorage.setItem("gjnet."+k,JSON.stringify(v));}catch(e){return null}}
async function fetchGz(url,onProg){
  const res=await fetch(url); if(!res.ok) throw new Error(url+" 응답 "+res.status);
  const total=+res.headers.get("content-length")||0; let got=0;const chunks=[];const rd=res.body.getReader();
  for(;;){const {done,value}=await rd.read();if(done)break;chunks.push(value);got+=value.byteLength;onProg&&onProg(got,total);}
  let buf=new Uint8Array(got);let o=0;for(const c of chunks){buf.set(c,o);o+=c.byteLength;}
  if(/\.txt$/.test(url)){const bin=atob(new TextDecoder().decode(buf).trim());buf=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)buf[i]=bin.charCodeAt(i);}
  if(buf[0]!==0x1f||buf[1]!==0x8b) return buf.buffer;
  return new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).arrayBuffer();
}
/* EPSG:5186 */
const TM=(()=>{const a=6378137,f=1/298.257222101,e2=f*(2-f),ep2=e2/(1-e2),k0=1,lat0=38*Math.PI/180,lon0=127*Math.PI/180,FE=200000,FN=600000;
  const e4=e2*e2,e6=e4*e2;
  const M=p=>a*((1-e2/4-3*e4/64-5*e6/256)*p-(3*e2/8+3*e4/32+45*e6/1024)*Math.sin(2*p)+(15*e4/256+45*e6/1024)*Math.sin(4*p)-(35*e6/3072)*Math.sin(6*p));
  const M0=M(lat0);
  function fwd(lat,lon){const p=lat*Math.PI/180,l=lon*Math.PI/180,s=Math.sin(p),c=Math.cos(p),t=Math.tan(p);
    const N=a/Math.sqrt(1-e2*s*s),T=t*t,C=ep2*c*c,A=(l-lon0)*c;
    const x=FE+k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120);
    const y=FN+k0*(M(p)-M0+N*t*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));return [x,y];}
  function inv(x,y){const m=M0+(y-FN)/k0,mu=m/(a*(1-e2/4-3*e4/64-5*e6/256)),e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
    const p1=mu+(3*e1/2-27*e1**3/32)*Math.sin(2*mu)+(21*e1*e1/16-55*e1**4/32)*Math.sin(4*mu)+(151*e1**3/96)*Math.sin(6*mu)+(1097*e1**4/512)*Math.sin(8*mu);
    const s=Math.sin(p1),c=Math.cos(p1),t=Math.tan(p1),C1=ep2*c*c,T1=t*t,N1=a/Math.sqrt(1-e2*s*s),R1=a*(1-e2)/Math.pow(1-e2*s*s,1.5),D=(x-FE)/(N1*k0);
    const lat=p1-(N1*t/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*D**4/24+(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*D**6/720);
    const lon=lon0+(D-(1+2*T1+C1)*D**3/6+(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*D**5/120)/c;return [lat*180/Math.PI,lon*180/Math.PI];}
  return {fwd,inv};})();

/* ============ data ============ */
let NET,NN,NL,X,Y,NT,DMA,LT,N1,N2,DIA,INIT,LEN,GPTS,GOFF,HQ,HP,HD,H=24;
let ADJ,ADJS,RES=[],resIdx,DMACEN=[],BOUNDS,DONGS=[];
const linkName=l=>{const c=NET.links.c[l];const t=LT[l];
  if(t===2) return c||("가압장 "+NET.links.id[l]);
  if(t===3) return c&&c!=="감압밸브"?c.replace(/^\(감압\)/,"")+" 감압":"감압밸브 "+NET.links.id[l];
  if(t===7) return (c||"경계밸브")+" "+NET.links.id[l];
  return (INIT[l]===0?"폐쇄관로 ":"관로 ")+NET.links.id[l];};
const linkKind=l=>{const t=LT[l];if(t===2)return "가압장";if(t===3)return "감압밸브";if(t===7)return "경계밸브";if(t===0)return "역지밸브";return INIT[l]===0?"폐쇄관로":"관로";};
const resKind=i=>/정수/.test(NET.nodes.id[i])?"정수장":"배수지";
const resName=i=>{const s=NET.nodes.id[i];return /정수$/.test(s)?"광주"+s+"장":s;};
const qd=v=>v>0?Math.expm1(v/2000):v<0?-Math.expm1(-v/2000):0;
const Qh=(h,l)=>qd(HQ[h*NL+l]); const Ph=(h,i)=>HP[h*NN+i]/10; const Dh=(h,i)=>qd(HD[h*NN+i]);
function flowDir(l,h){const v=HQ[h*NL+l];return v>=20?1:v<=-20?-1:0;}
const SRC_COL=["#0b84c6","#e4572e","#2a9d8f","#9b5de5","#f2a541","#d62f8a","#5c8001","#3a5a98","#c17c74","#00a6a6","#8d6a9f","#b07d00","#4f772d"];
function hueCol(i,alpha=1){const g=(i*137.508)%360;return `hsla(${g.toFixed(0)},68%,46%,${alpha})`;}
const SELC="#00a0ff";const FF='"Malgun Gothic","맑은 고딕","Noto Sans KR","Apple SD Gothic Neo",system-ui,sans-serif';

async function loadAll(){
  const bar=$("#ldBar"),txt=$("#ldTxt");let p1=0,p2=0;const upd=()=>{bar.style.width=Math.min(100,(p1*0.35+p2*0.65)*100).toFixed(0)+"%";};
  const [netBuf,hydBuf]=await Promise.all([fetchGz("net.json.gz.txt",(g,t)=>{p1=t?g/t:0.5;upd();}),fetchGz("hyd.bin.gz.txt",(g,t)=>{p2=t?g/t:0.5;upd();})]);
  txt.textContent="관망 구성 중…";await new Promise(r=>setTimeout(r,20));
  NET=JSON.parse(new TextDecoder().decode(netBuf));
  const n=NET.nodes,l=NET.links;NN=n.id.length;NL=l.id.length;
  X=new Float64Array(NN);Y=new Float64Array(NN);for(let i=0;i<NN;i++){X[i]=n.x[i]/10;Y[i]=n.y[i]/10;}
  NT=Int8Array.from(n.t);DMA=Int16Array.from(n.dma);LT=Int8Array.from(l.t);N1=Int32Array.from(l.n1);N2=Int32Array.from(l.n2);DIA=Float32Array.from(l.dia);INIT=Int8Array.from(l.init);LEN=Float32Array.from(l.len);
  let tot=0;for(let i=0;i<NL;i++)tot+=2+(l.voff[i+1]-l.voff[i]);
  GPTS=new Float32Array(tot*2);GOFF=new Int32Array(NL+1);let k=0;
  for(let i=0;i<NL;i++){GOFF[i]=k;GPTS[k*2]=X[N1[i]];GPTS[k*2+1]=Y[N1[i]];k++;
    for(let j=l.voff[i];j<l.voff[i+1];j++){GPTS[k*2]=l.vx[j]/10;GPTS[k*2+1]=l.vy[j]/10;k++;}
    GPTS[k*2]=X[N2[i]];GPTS[k*2+1]=Y[N2[i]];k++;}
  GOFF[NL]=k;
  ADJS=new Int32Array(NN+1);for(let i=0;i<NL;i++){ADJS[N1[i]+1]++;ADJS[N2[i]+1]++;}
  for(let i=0;i<NN;i++)ADJS[i+1]+=ADJS[i];ADJ=new Int32Array(ADJS[NN]);const pos=ADJS.slice(0,NN);
  for(let i=0;i<NL;i++){ADJ[pos[N1[i]]++]=i;ADJ[pos[N2[i]]++]=i;}
  HQ=new Int16Array(hydBuf,0,H*NL);HP=new Int16Array(hydBuf,H*NL*2,H*NN);HD=new Int16Array(hydBuf,H*NL*2+H*NN*2,H*NN);
  resIdx=new Int16Array(NN).fill(-1);for(let i=0;i<NN;i++)if(NT[i]===1){resIdx[i]=RES.length;RES.push(i);}
  const dn=NET.dmas.length,sx=new Float64Array(dn),sy=new Float64Array(dn),sc=new Int32Array(dn);
  for(let i=0;i<NN;i++){const d=DMA[i];sx[d]+=X[i];sy[d]+=Y[i];sc[d]++;}
  for(let d=0;d<dn;d++)DMACEN.push(sc[d]?[sx[d]/sc[d],sy[d]/sc[d],sc[d]]:null);
  let x0=1e18,y0=1e18,x1=-1e18,y1=-1e18;for(let i=0;i<NN;i++){if(X[i]<x0)x0=X[i];if(X[i]>x1)x1=X[i];if(Y[i]<y0)y0=Y[i];if(Y[i]>y1)y1=Y[i];}
  BOUNDS={x0,y0,x1,y1};
  const ox=NET.meta.x0,oy=NET.meta.y0;
  for(const d of NET.dongs){const polys=d.p.map(r=>{const a=new Float32Array(r.length*2);r.forEach((c,i)=>{const [x,y]=TM.fwd(c[1],c[0]);a[i*2]=x-ox;a[i*2+1]=y-oy;});return a;});
    let cx=0,cy=0,cn=0,best=polys[0];for(const p of polys)if(p.length>best.length)best=p;for(let i=0;i<best.length;i+=2){cx+=best[i];cy+=best[i+1];cn++;}
    DONGS.push({n:d.n,polys,cx:cx/cn,cy:cy/cn});}
  buildGrid();buildSearch();
}
const toLocal=(lat,lon)=>{const [x,y]=TM.fwd(lat,lon);return [x-NET.meta.x0,y-NET.meta.y0];};
const toLatLon=(x,y)=>TM.inv(x+NET.meta.x0,y+NET.meta.y0);

/* ============ basemap (OpenStreetMap) ============ */
let BM=null;
async function loadBasemap(){try{const buf=await fetchGz("osm.json.gz.txt");const d=JSON.parse(new TextDecoder().decode(buf));
  const dec=L=>{const feats=[];if(!L)return feats;const o=L.o,dd=L.d;let k=0;for(let f=0;f<o.length;f++){const n=o[f];const a=new Float32Array(n*2);let x=0,y=0,a0=1e18,b0=1e18,a1=-1e18,b1=-1e18;
      for(let i=0;i<n;i++){x+=dd[k++];y+=dd[k++];a[i*2]=x;a[i*2+1]=y;if(x<a0)a0=x;if(x>a1)a1=x;if(y<b0)b0=y;if(y>b1)b1=y;}feats.push({p:a,b:[a0,b0,a1,b1]});}return feats;};
  BM={poly:{},line:{},road:{},rname:d.rname||[],place:d.place||[],poi:d.poi||[],pname:d.pname||[]};
  for(const k in d.poly)BM.poly[k]=dec(d.poly[k]);for(const k in d.line)BM.line[k]=dec(d.line[k]);for(const k in d.road)BM.road[k]=dec(d.road[k]);
  if(d.addr)addAddrPoints(d.addr);
  baseDirty=true;}catch(e){console.warn("배경지도",e);}}
const BMS={ // Kakao 지도 느낌의 색
  land:"#f2efe9",water:"#a9d3ef",waterLine:"#8fc3e8",park:"#d4e8c4",forest:"#dcebd0",golf:"#cbe5b8",rail:"#9a9a9a",
  road:{mw:["#f39b4a","#d8813a",22,2.6],tr:["#ffc27a","#e19b4c",18,2.2],pr:["#ffe28a","#dbb75a",15,1.9],se:["#ffffff","#c8c0b2",12,1.6],te:["#ffffff","#cdc6ba",10,1.3],mi:["#ffffff","#d7d1c6",6,0.8]}};
function drawBasemap(C,x0,y0,x1,y1){if(!BM||!layers.base)return;const s=view.s,cx=view.cx,cy=view.cy,hw=VP.w/2,hh=VP.h/2;
  const inV=b=>!(b[2]<x0||b[0]>x1||b[3]<y0||b[1]>y1);const minPx=0.6/s;
  const path=(feats,close,minSize)=>{C.beginPath();for(const f of feats){if(!inV(f.b))continue;if(minSize&&(f.b[2]-f.b[0])<minSize&&(f.b[3]-f.b[1])<minSize)continue;const p=f.p;
      C.moveTo((p[0]-cx)*s+hw,hh-(p[1]-cy)*s);let lx=p[0],ly=p[1];for(let i=2;i<p.length;i+=2){const x=p[i],y=p[i+1];if(Math.abs(x-lx)<minPx&&Math.abs(y-ly)<minPx&&i<p.length-2)continue;C.lineTo((x-cx)*s+hw,hh-(y-cy)*s);lx=x;ly=y;}if(close)C.closePath();}};
  const ms=3/s;
  C.fillStyle=BMS.forest;path(BM.poly.forest||[],true,ms);C.fill();
  C.fillStyle=BMS.park;path(BM.poly.park||[],true,ms);C.fill();
  C.fillStyle=BMS.golf;path(BM.poly.golf||[],true,ms);C.fill();
  C.fillStyle=BMS.water;path(BM.poly.water||[],true,ms);C.fill("evenodd");
  C.lineCap="round";C.lineJoin="round";
  C.strokeStyle=BMS.waterLine;C.lineWidth=Math.max(1.6,40*s);path(BM.line.river||[],false);C.stroke();
  if(s>0.02){C.lineWidth=Math.max(1,6*s);path(BM.line.stream||[],false);C.stroke();}
  if(s>0.01){C.strokeStyle=BMS.rail;C.lineWidth=Math.max(1.4,4*s);C.setLineDash([6,5]);path(BM.line.rail||[],false);C.stroke();C.setLineDash([]);}
  const order=["mi","te","se","pr","tr","mw"];const show={mi:s>0.05,te:s>0.015,se:true,pr:true,tr:true,mw:true};
  // casing
  for(const k of order){if(!show[k]||!BM.road[k])continue;const st=BMS.road[k];const w=Math.max(st[3],st[2]*s);C.strokeStyle=st[1];C.lineWidth=w+(s>0.15?2:1);path(BM.road[k],false);C.stroke();}
  for(const k of order){if(!show[k]||!BM.road[k])continue;const st=BMS.road[k];const w=Math.max(st[3],st[2]*s);C.strokeStyle=st[0];C.lineWidth=w;path(BM.road[k],false);C.stroke();}
}
function drawBasemapLabels(C,x0,y0,x1,y1){if(!BM||!layers.base)return;const s=view.s;C.save();C.textAlign="center";C.textBaseline="middle";
  const sc=(x,y)=>[(x-view.cx)*s+VP.w/2,VP.h/2-(y-view.cy)*s];const placed=[];const free=(x,y,w,h)=>{for(const r of placed)if(Math.abs(r[0]-x)<(r[2]+w)/2&&Math.abs(r[1]-y)<(r[3]+h)/2)return false;placed.push([x,y,w,h]);return true;};
  const halo=(t,x,y,col,font)=>{C.font=font;const w=C.measureText(t).width;if(!free(x,y,w+6,16))return;C.lineWidth=3.5;C.strokeStyle="rgba(255,255,255,.92)";C.strokeText(t,x,y);C.fillStyle=col;C.fillText(t,x,y);};
  if(s>0.12){for(const r of BM.rname){const [x,y,ang,name,cls]=r;if(x<x0||x>x1||y<y0||y>y1)continue;if(cls>=4&&s<0.35)continue;const [a,b]=sc(x,y);
      C.save();C.translate(a,b);let an=-ang;if(an>Math.PI/2)an-=Math.PI;if(an<-Math.PI/2)an+=Math.PI;C.rotate(an);C.font=`500 11px ${FF}`;const w=C.measureText(name).width;
      if(free(a,b,Math.abs(Math.cos(an))*w+14,Math.abs(Math.sin(an))*w+14)){C.lineWidth=3;C.strokeStyle="rgba(255,255,255,.95)";C.strokeText(name,0,0);C.fillStyle="#6b5a3d";C.fillText(name,0,0);}C.restore();}}
  for(const p of BM.place){const [x,y,name,rank]=p;if(x<x0||x>x1||y<y0||y>y1)continue;if(rank<=1&&s<0.03)continue;if(rank===0&&s<0.12)continue;const [a,b]=sc(x,y);halo(name,a,b,"#55524c",`${rank>=2?700:500} ${rank>=2?13:11.5}px ${FF}`);}
  if(s>0.3)for(const p of BM.poi){const [x,y,name]=p;if(x<x0||x>x1||y<y0||y>y1)continue;const [a,b]=sc(x,y);halo(name,a,b,"#3a6a9c",`500 11px ${FF}`);}
  C.restore();}

/* ============ spatial grid ============ */
const CELL=300;let GX0,GY0,GW,GH,GRID,GRIDN;

  openSheet("선택",`${hh2(HOUR)}:00 기준 제원 · 길게 누르면 분석 메뉴`,`${cards}<div class="actions"><button class="btn" id="sClear">선택 해제</button></div>`,sheetState==="closed"||sheetState==="peek"?"half":undefined);
  const B=$("#shBody");B.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{SELN.splice(+b.dataset.rm,1);redraw();openChapter("sel");});
  B.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const e=SELN[+b.dataset.go];const sp=e.t==="n"?specNode(e.i):specLink(e.i);flyTo(sp.x,sp.y,Math.max(view.s,0.6));});
  $("#sClear").onclick=()=>{SELN=[];redraw();openChapter("sel");};redraw();}

function flyTo(x,y,s){const s0=view.s,x0=view.cx,y0=view.cy;const off=(sheetH()+20-120)/2/s;const t0=performance.now();const dur=matchMedia("(prefers-reduced-motion: reduce)").matches?0:350;
  const step=t=>{const k=dur?Math.min(1,(t-t0)/dur):1,e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;view.s=s0*Math.pow(s/s0,e);view.cx=x0+(x-x0)*e;view.cy=y0+(y-off-y0)*e;needDraw=true;if(k<1)requestAnimationFrame(step);else redraw();};requestAnimationFrame(step);}
function wireRows(){$("#shBody").querySelectorAll("tr.click").forEach(tr=>{if(tr.dataset.c!=null)return;tr.onclick=()=>{const l=tr.dataset.l,n=tr.dataset.n,d=tr.dataset.d;
  if(l!=null){const [x,y]=linkMid(+l);flyTo(x,y,Math.max(view.s,0.6));}else if(n!=null){flyTo(X[+n],Y[+n],Math.max(view.s,0.6));}else if(d!=null){const c=DMACEN[+d];if(c)flyTo(c[0],c[1],Math.max(view.s,0.12));}};});}
function tagFor(l){const t=LT[l];return t===2?'<span class="tag pump">가압장</span>':t===3?'<span class="tag prv">감압밸브</span>':t===7?'<span class="tag tcv">경계밸브</span>':INIT[l]===0?'<span class="tag">폐쇄관로</span>':'<span class="tag">관로</span>';}

/* ============ 급수원 (상류) ============ */
let TMODE=store("tmode")||"sel";
function segHtml(grp){return `<div class="seg" role="group" aria-label="선 표시 방식"><button data-m="sel" class="${TMODE==="sel"?"on":""}">선택 색</button><button data-m="grp" class="${TMODE==="grp"?"on":""}">${grp}</button></div>`;}
function wireSeg(){$("#shBody").querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{TMODE=b.dataset.m;store("tmode",TMODE);openChapter(CUR);});}
function traceUp(){const targets=upTargets();if(!targets.length){openChapter("sel");return;}const h=HOUR;
  const state=new Uint8Array(NN),pos=new Int32Array(NN).fill(-1),order=[];
  for(const tg of targets){if(state[tg])continue;const stack=[tg],it=[ADJS[tg]];state[tg]=1;
    while(stack.length){const v=stack[stack.length-1];let k=it[it.length-1];let pushed=false;
      for(;k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(to!==v)continue;
        if(state[from]===0){state[from]=1;it[it.length-1]=k+1;stack.push(from);it.push(ADJS[from]);pushed=true;break;}}
      if(!pushed){state[v]=2;pos[v]=order.length;order.push(v);stack.pop();it.pop();}}}
  const facs=[],facIdx=new Map(),upLinks=[];
  for(const v of order)for(let k=ADJS[v];k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(to!==v||state[from]!==2)continue;upLinks.push(l);
    if((LT[l]===2||LT[l]===3||LT[l]===7)&&!facIdx.has(l)){facIdx.set(l,facs.length);facs.push(l);}}
  const dmaIdx=new Map(),dmas=[];for(const v of order){const d=DMA[v];if(NET.dmas[d]&&!dmaIdx.has(d)){dmaIdx.set(d,dmas.length);dmas.push(d);}}
  const R=RES.length,F=facs.length,Dn=dmas.length,T=R+F+Dn;const vec=new Float32Array(order.length*T);
  for(let p=0;p<order.length;p++){const v=order[p],base=p*T;
    if(NT[v]===1)vec[base+resIdx[v]]=1;
    else{let tot=0;for(let k=ADJS[v];k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(to!==v)continue;const pu=pos[from];if(pu<0||pu>=p)continue;
        const w=Math.abs(Qh(h,l));tot+=w;const bu=pu*T;for(let t=0;t<T;t++)vec[base+t]+=w*vec[bu+t];const fi=facIdx.get(l);if(fi!==undefined)vec[base+R+fi]+=w*(1-vec[bu+R+fi]);}
      if(tot>0)for(let t=0;t<T;t++)vec[base+t]/=tot;}
    if(NET.dmas[DMA[v]])vec[base+R+F+dmaIdx.get(DMA[v])]=1;}
  const share=i=>{let s=0;for(const tg of targets)s+=vec[pos[tg]*T+i];return s/targets.length;};
  const links=new Map();const mx=Math.max(1,...upLinks.map(l=>Math.abs(Qh(h,l))));
  for(const l of upLinks){const dir=flowDir(l,h);const from=dir>0?N1[l]:N2[l];const b=pos[from]*T;let bi=0,bv=-1;for(let r=0;r<R;r++)if(vec[b+r]>bv){bv=vec[b+r];bi=r;}
    const w=1.4+1.6*Math.log1p(Math.abs(Qh(h,l)))/Math.log1p(mx);links.set(l,TMODE==="sel"?{c:css("--sel"),w:3.5}:{c:SRC_COL[bi%SRC_COL.length],w});}
  const srcs=[];for(let r=0;r<R;r++){const v=share(r);if(v>0.001)srcs.push({r,v});}srcs.sort((a,b)=>b.v-a.v);
  const fl=[];for(let f=0;f<F;f++){const v=share(R+f);if(v>=0.005)fl.push({l:facs[f],v});}
  const facOrder=l=>{const dir=flowDir(l,h);return pos[dir>0?N1[l]:N2[l]];};fl.sort((a,b)=>facOrder(a.l)-facOrder(b.l));
  const dl=[];for(let d=0;d<Dn;d++){const v=share(R+F+d);if(v>=0.005)dl.push({d:dmas[d],v});}
  const firstPos=new Map();for(const v of order)if(!firstPos.has(DMA[v]))firstPos.set(DMA[v],pos[v]);dl.sort((a,b)=>firstPos.get(a.d)-firstPos.get(b.d));
  let plen=0;for(const l of upLinks)plen+=LEN[l];
  OV={links,nodes:new Map(),pins:targets.slice(0,20).map(t=>({x:X[t],y:Y[t],c:"#e0119d",label:targets.length===1?"대상 지점":""}))};
  setLegend(TMODE==="sel"?[{c:css("--sel"),t:"급수원 선택 (상류 관망)"}]:srcs.slice(0,6).map(s=>({c:SRC_COL[s.r%SRC_COL.length],t:resName(RES[s.r])})));
  const t0=targets[0];const multi=targets.length>1;
  const html=segHtml("급수원별 색")+`
   <div class="kv">${multi?`<div><span>대상 지점</span><b>${targets.length}곳 (평균)</b></div>`:`<div><span>대상 절점</span><b>${esc(NET.nodes.id[t0])}</b></div><div><span>소블록</span><b>${esc(NET.dmas[DMA[t0]]||"–")}</b></div><div><span>수압</span><b>${fmt(Ph(h,t0),1)} m</b></div>`}
   <div><span>상류 관로</span><b>${fmt(plen/1000,1)} km · ${fmt(upLinks.length)}개</b></div></div>
   ${srcs.length?"":`<div class="callout warn">${hh2(h)}:00에 이 지점으로 흐르는 유량이 없습니다(정체 또는 폐쇄 구역).</div>`}
   <h3>급수원 구성</h3>
   <div class="tbl"><table><thead><tr><th>급수원</th><th>구분</th><th class="r">기여율</th><th></th></tr></thead><tbody>
   ${srcs.map(s=>`<tr class="click" data-n="${RES[s.r]}"><td><span class="sw" style="background:${SRC_COL[s.r%SRC_COL.length]}"></span>${esc(resName(RES[s.r]))}</td><td><span class="tag res">${resKind(RES[s.r])}</span></td><td class="r num">${fmt(s.v*100,1)}%</td><td style="width:30%"><div class="bar"><i style="width:${(s.v*100).toFixed(1)}%;background:${SRC_COL[s.r%SRC_COL.length]}"></i></div></td></tr>`).join("")}</tbody></table></div>
   <h3>경유 시설 (상류 → 하류)</h3>
   ${fl.length?`<div class="tbl"><table><thead><tr><th>#</th><th>시설</th><th>구분</th><th class="r">통과 비율</th><th class="r">유량 m³/일</th><th class="r">설정</th></tr></thead><tbody>
   ${fl.map((f,i)=>`<tr class="click" data-l="${f.l}"><td class="num">${i+1}</td><td>${esc(linkName(f.l))}</td><td>${tagFor(f.l)}</td><td class="r num">${fmt(f.v*100,0)}%</td><td class="r num">${fmt(Math.abs(Qh(h,f.l)),0)}</td><td class="r num">${LT[f.l]===3?fmt(NET.links.set[f.l],0)+" m":"–"}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">가압장·감압밸브·경계밸브를 거치지 않고 급수원에서 바로 공급됩니다.</p>`}
   <h3>경유 소블록 (상류 → 하류)</h3>
   <div class="tbl"><table><thead><tr><th>소블록</th><th class="r">통과 비율</th><th></th></tr></thead><tbody>
   ${dl.map(d=>`<tr class="click" data-d="${d.d}"><td>${esc(NET.dmas[d.d])}</td><td class="r num">${fmt(d.v*100,0)}%</td><td style="width:35%"><div class="bar"><i style="width:${(d.v*100).toFixed(0)}%;background:var(--accent)"></i></div></td></tr>`).join("")}</tbody></table></div>
   <p class="note">${TMODE==="sel"?"빨간 선은 선택 지점으로 물이 흘러오는 상류 관망입니다(GIS PIPE 급수원 선택 방식).":"선 색은 각 관로에 가장 많이 섞인 급수원입니다."} 비율은 ${hh2(h)}:00 EPANET 해석 유량 기준입니다.</p>`;
  openSheet("급수원 선택",`${hh2(h)}:00 · ${srcs.map(s=>resName(RES[s.r])+" "+fmt(s.v*100,0)+"%").slice(0,3).join(" · ")||"유입 없음"}`,html);
  wireRows();wireSeg();fitNodes(order.length>1?order:targets);}

/* ============ 급수구역 (하류) ============ */
function downFracMulti(srcs,h){const state=new Uint8Array(NN),post=[];
  for(const s0 of srcs){if(state[s0])continue;const stack=[s0],it=[ADJS[s0]];state[s0]=1;
    while(stack.length){const v=stack[stack.length-1];let k=it[it.length-1];let pushed=false;
      for(;k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(from!==v)continue;
        if(state[to]===0){state[to]=1;it[it.length-1]=k+1;stack.push(to);it.push(ADJS[to]);pushed=true;break;}}
      if(!pushed){post.push(v);stack.pop();it.pop();}}}
  const topo=post.reverse();const rank=new Int32Array(NN).fill(-1);topo.forEach((v,i)=>rank[v]=i);const f=new Float32Array(NN);const isSrc=new Set(srcs);for(const s0 of srcs)f[s0]=1;const dl=[];
  for(let i=0;i<topo.length;i++){const v=topo[i];if(isSrc.has(v))continue;let tot=0,acc=0;for(let k=ADJS[v];k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(to!==v)continue;
      const w=Math.abs(Qh(h,l));tot+=w;if(rank[from]>=0&&rank[from]<i){acc+=w*f[from];if(f[from]>0)dl.push(l);}}f[v]=tot>0?acc/tot:0;}
  return {f,topo,rank,dl};}
function traceDown(){const srcs=downSources();if(!srcs.length){openChapter("sel");return;}const h=HOUR;
  const {f:hfrac,topo,rank,dl:dlinks}=downFracMulti(srcs,h);
  const byD=new Map();let supply=0,full=0,part=0,meters=0;
  for(const v of topo){const fr=hfrac[v];if(fr<0.01)continue;const dd=Math.max(0,Dh(h,v));supply+=dd*fr;fr>0.99?full++:part++;if(CN&&fr>=0.5)meters+=CN[v];const k=DMA[v];let o=byD.get(k);if(!o){o={d:k,q:0,n:0,len:0,m:0,first:rank[v]};byD.set(k,o);}o.q+=dd*fr;o.n++;if(CN&&fr>=0.5)o.m+=CN[v];}
  for(const l of dlinks){const k=DMA[flowDir(l,h)>0?N2[l]:N1[l]];const o=byD.get(k);if(o)o.len+=LEN[l];}
  const rows=[...byD.values()].sort((a,b)=>a.first-b.first);
  const fac=[];const seen=new Set();for(const l of dlinks){if((LT[l]===2||LT[l]===3)&&!seen.has(l)){seen.add(l);fac.push(l);}}
  const links=new Map();const mx=Math.max(1,...dlinks.map(l=>Math.abs(Qh(h,l))));
  for(const l of dlinks){const to=flowDir(l,h)>0?N2[l]:N1[l];const fr=hfrac[to];if(fr<0.01)continue;const w=1.4+1.6*Math.log1p(Math.abs(Qh(h,l)))/Math.log1p(mx);links.set(l,TMODE==="sel"?{c:css("--sel"),w:3.5}:{c:hueCol(DMA[to],0.35+0.65*fr),w});}
  OV={links,nodes:new Map(),pins:srcs.slice(0,20).map(t=>({x:X[t],y:Y[t],c:"#e0119d",label:srcs.length===1?"공급 시작점":""}))};
  setLegend(TMODE==="sel"?[{c:css("--sel"),t:"급수구역 선택 (하류 관망)"}]:rows.slice(0,6).map(r=>({c:hueCol(r.d),t:NET.dmas[r.d]||"블록 미지정"})));
  const html=segHtml("소블록별 색")+`
   <div class="kv"><div><span>시작 지점</span><b>${srcs.length===1?esc(NET.nodes.id[srcs[0]]):srcs.length+"곳"}</b></div><div><span>공급 수량</span><b>${fmt(supply,0)} m³/일</b></div>
   <div><span>공급 수용가</span><b>${CN?fmt(meters)+" 개":"…"}</b></div><div><span>공급 소블록</span><b>${rows.filter(r=>NET.dmas[r.d]).length}개</b></div>
   <div><span>전량 공급 절점</span><b>${fmt(full)}</b></div><div><span>일부 공급 절점</span><b>${fmt(part)}</b></div></div>
   ${topo.length<=srcs.length?`<div class="callout warn">${hh2(h)}:00에 이 지점에서 나가는 유량이 없습니다(말단 또는 정체 구간).</div>`:""}
   <h3>공급 소블록</h3>
   <div class="tbl"><table><thead><tr><th>소블록</th><th class="r">공급량 m³/일</th><th class="r">수용가</th><th class="r">관로 km</th></tr></thead><tbody>
   ${rows.map(r=>`<tr class="click" data-d="${r.d}"><td><span class="sw" style="background:${hueCol(r.d)}"></span>${esc(NET.dmas[r.d]||"블록 미지정")}</td><td class="r num">${fmt(r.q,0)}</td><td class="r num">${CN?fmt(r.m):"…"}</td><td class="r num">${fmt(r.len/1000,2)}</td></tr>`).join("")}</tbody></table></div>
   <h3>하류 가압장·감압밸브</h3>
   ${fac.length?`<div class="tbl"><table><thead><tr><th>시설</th><th>구분</th><th class="r">유량 m³/일</th></tr></thead><tbody>${fac.map(l=>`<tr class="click" data-l="${l}"><td>${esc(linkName(l))}</td><td>${tagFor(l)}</td><td class="r num">${fmt(Math.abs(Qh(h,l)),0)}</td></tr>`).join("")}</tbody></table></div>`:`<p class="note">하류에 가압장·감압밸브가 없습니다.</p>`}
   <p class="note">${TMODE==="sel"?"빨간 선은 선택 지점의 물이 흘러가는 하류 관망입니다(GIS PIPE 급수구역 선택 방식).":"선 색은 소블록, 진하기는 시작점에서 온 물의 비율입니다."} 공급 수용가는 시작점 물이 절반 이상인 절점의 수도미터 수입니다.</p>`;
  openSheet("급수구역 선택",`${hh2(h)}:00 · ${fmt(supply,0)} m³/일 · ${rows.length}개 블록`,html);
  wireRows();wireSeg();fitNodes(topo.filter(v=>hfrac[v]>=0.01));}

/* ============ 수리계산 엔진 ============ */
const ENG={st:"idle",w:null,seq:0,pend:new Map(),base:new Map(),p:null};
function setEng(st,txt){ENG.st=st;$("#engDot").className="dot "+(st==="ready"?"ready":st==="loading"||st==="busy"?"busy":st==="failed"?"fail":"");$("#engTxt").textContent=txt;}
function ensureEngine(){if(ENG.p)return ENG.p;setEng("loading","엔진…");
  ENG.p=(async()=>{const buf=await fetchGz("sim.inp.gz.txt");const inp=new TextDecoder().decode(buf);
    const w=new Worker("engine.js");ENG.w=w;w.onmessage=e=>{const p=ENG.pend.get(e.data.id);if(p){ENG.pend.delete(e.data.id);e.data.ok?p.res(e.data.r):p.rej(new Error(e.data.error));}};
    w.onerror=()=>{for(const p of ENG.pend.values())p.rej(new Error("엔진 오류"));ENG.pend.clear();};
    await call("init",{inp,topo:{nn:NN,nl:NL,n1:Array.from(N1),n2:Array.from(N2),init:Array.from(INIT),nt:Array.from(NT)}},90000);
    setEng("ready","엔진");return true;})().catch(err=>{console.warn(err);setEng("failed","엔진✕");ENG.p=Promise.resolve(false);return false;});
  return ENG.p;}
function call(type,payload,timeout=60000){return new Promise((res,rej)=>{const id=++ENG.seq;ENG.pend.set(id,{res,rej});ENG.w.postMessage({type,id,...payload});setTimeout(()=>{if(ENG.pend.has(id)){ENG.pend.delete(id);rej(new Error("시간 초과"));}},timeout);});}
async function solve(args){return call("solve",{args});}
async function baseAt(h){if(!ENG.base.has(h))ENG.base.set(h,await solve({hour:h}));return ENG.base.get(h);}
$("#chipEngine").onclick=()=>{if(ENG.st==="idle"||ENG.st==="failed"){ENG.p=null;ensureEngine();}CUR=null;renderTabs();openSheet("수리계산 엔진",ENG.st==="ready"?"EPANET 2.2 (WebAssembly) 준비됨":ENG.st==="failed"?"이 기기에서 실행할 수 없음":"준비 중",
  `<p class="note">단수 시뮬레이션은 휴대폰 안에서 EPANET 2.2 엔진으로 정상류 해석을 합니다. 한 번 계산에 보통 0.5~3초가 걸립니다.</p><p class="note">급수원·급수구역은 미리 계산한 시간대별(00~23시) 해석 유량을 씁니다.</p>`,"half");};
function connectivity(isOpen){const seen=new Uint8Array(NN),st=[];for(const r of RES){seen[r]=1;st.push(r);}
  while(st.length){const v=st.pop();for(let k=ADJS[v];k<ADJS[v+1];k++){const l=ADJ[k];if(!isOpen(l))continue;const w=N1[l]===v?N2[l]:N1[l];if(!seen[w]){seen[w]=1;st.push(w);}}}return seen;}

/* ============ 수용가(수도미터) ============ */
let CU=null,CN=null,CS=null,CI=null;

  CN=new Int32Array(NN);for(const n of CU.n)CN[n]++;CS=new Int32Array(NN+1);for(let i=0;i<NN;i++)CS[i+1]=CS[i]+CN[i];

function findCands(){const sc=SC;const cur=cutSet(sc.closed,sc.opened);const rem=new Uint8Array(NN);for(const i of cur.cutN)rem[i]=1;const out=[];

function flowSet(qs,area){const set=new Uint8Array(NL);const aff=new Uint8Array(NN);for(const i of area)aff[i]=1;
  for(let l=0;l<NL;l++){let any=false,chg=false;for(let k=0;k<qs.length;k++){const q=qs[k][l];if(Math.abs(q)>FT)any=true;if(k){const p=qs[k-1][l];const a=Math.abs(p)>FT,c=Math.abs(q)>FT;

function blockAt(x,y,rad){const ci=Math.floor((x-GX0)/CELL),cj=Math.floor((y-GY0)/CELL),r=Math.max(1,Math.min(6,Math.ceil(rad/CELL)));const cnt=new Map();let best=-1,bd=1e18;

function flowChain(v,h){ // 가장 큰 유입 유량을 따라 상류로 → 시설 위주 경로

    for(let k=ADJS[v];k<ADJS[v+1];k++){const l=ADJ[k];const dir=flowDir(l,h);if(!dir)continue;const from=dir>0?N1[l]:N2[l],to=dir>0?N2[l]:N1[l];if(to!==v||seen.has(from))continue;const q=Math.abs(Qh(h,l));if(q>bq){bq=q;bl=l;}}

/* ---- 도구 2: 감압밸브 설정·밸브 조작 시뮬레이션 (임시) ---- */

const pcol=m=>m<15?PCOL.low:m<20?PCOL.warn:m>=70?PCOL.high:PCOL.ok;
async function toolSimulate(a){const ok=await ensureEngine();if(!ok)throw new Error("이 기기에서 수리계산 엔진을 쓸 수 없습니다");
  const hour=a.hour!=null&&a.hour>=0&&a.hour<24?Math.floor(+a.hour):HOUR;const settings={},chg=[],closed=[],opened=[];
  for(const s of (a.prv_settings||[])){let l=findLinkId(s.id);if(l<0&&SELN[0]&&SELN[0].t==="l"&&LT[SELN[0].i]===3&&(s.id==null||s.id===""||s.id==="selected"))l=SELN[0].i;if(l<0)throw new Error("감압밸브를 찾지 못했습니다: "+s.id);
    if(LT[l]!==3)throw new Error(linkName(l)+"은(는) 감압밸브가 아닙니다");let v=+s.setting_m;if(!(v>0&&v<200))throw new Error("설정압(m)이 올바르지 않습니다");settings[l]=v;chg.push(l);}
  for(const id of (a.close_ids||[])){const l=findLinkId(id);if(l<0)throw new Error("관로를 찾지 못했습니다: "+id);closed.push(l);}

      ...closed.map(l=>({잠금:linkName(l)})),...opened.map(l=>({열기:linkName(l)}))],

    수압_전_kgf:sb?{최저:kg2(sb.min),평균:kg2(sb.avg),최고:kg2(sb.max)}:null,수압_후_kgf:sa?{최저:kg2(sa.min),평균:kg2(sa.avg),최고:kg2(sa.max)}:null,
    수압부족_1점5미만_전:sb?{절점:sb.lowN.length,수도미터:mCount(sb.lowN)}:null,수압부족_1점5미만_후:sa?{절점:sa.lowN.length,수도미터:mCount(sa.lowN)}:null,
    단수_절점:cut.length,단수_수도미터:mCount(cut),해석_불안정:!!r.unbal,
    안내:"임시 시뮬레이션입니다. 화면의 [저장]을 눌러야 저장됩니다."};
  // 지도 표시

  const show=aff.length?aff:chg.map(l=>N2[l]);if(show.length)fitNodes(show,60);redraw();
  AI.scen={kind:"sim",label:out.변경.map(c=>c.감압밸브?`${c.감압밸브} ${c.설정압_전}→${c.설정압_후}`:c.잠금?`${c.잠금} 잠금`:`${c.열기} 열기`).join(", "),args:{hour,prv_settings:chg.map(l=>({id:NET.links.id[l],setting_m:settings[l]})),close_ids:closed.map(l=>NET.links.id[l]),open_ids:opened.map(l=>NET.links.id[l])},summary:out};

/* ---- 도구 3: 비상연계 관로 신설 후보 (단일 관로 사고 시 N개 이상 단수되는 곳) ---- */
function bridgeTree(){const V=NN+1,R=NN;const SRC=[];for(let i=0;i<NN;i++)if(NT[i]!==0)SRC.push(i);const sidx=new Int32Array(NN).fill(-1);SRC.forEach((s,k)=>sidx[s]=k);
  const tin=new Int32Array(V).fill(-1),low=new Int32Array(V),pe=new Int32Array(V).fill(-1),pn=new Int32Array(V).fill(-1),tout=new Int32Array(V),it=new Int32Array(V),pre=[];
  const nb=(v,k)=>{if(v===R)return k<SRC.length?[SRC[k],NL+k]:null;const d=ADJS[v+1]-ADJS[v];if(k<d){const l=ADJ[ADJS[v]+k];return [N1[l]===v?N2[l]:N1[l],l];}if(k===d&&sidx[v]>=0)return [R,NL+sidx[v]];return null;};
  let t=0;const stack=[R];tin[R]=low[R]=t++;pre.push(R);
  while(stack.length){const v=stack[stack.length-1];const r=nb(v,it[v]);
    if(r===null){stack.pop();tout[v]=t-1;const p=pn[v];if(p>=0)low[p]=Math.min(low[p],low[v]);continue;}
    it[v]++;const [w,e]=r;if(w<0||e===pe[v])continue;
    if(tin[w]<0){tin[w]=low[w]=t++;pre.push(w);pe[w]=e;pn[w]=v;stack.push(w);}else low[v]=Math.min(low[v],tin[w]);}
  const sub=new Float64Array(V);for(let k=pre.length-1;k>=0;k--){const v=pre[k];if(v<NN&&CN)sub[v]+=CN[v];if(pn[v]>=0)sub[pn[v]]+=sub[v];}
  const isBr=new Uint8Array(V),bAnc=new Int32Array(V).fill(-1);
  for(const v of pre){if(v===R)continue;if(pe[v]>=0&&pe[v]<NL&&low[v]>tin[pn[v]])isBr[v]=1;bAnc[v]=isBr[v]?v:bAnc[pn[v]];}
  return {R,tin,tout,pe,pn,sub,isBr,bAnc,pre};}
async function toolPlan(a){const T=Math.max(1,+a.min_meters||300),cnt=Math.max(1,Math.min(6,+a.count||3)),maxLen=Math.max(50,Math.min(3000,+a.max_length_m||800));
  await waitCN();aiNote("관망 연결 구조(사고 시 단수되는 가지관) 분석 중…");await new Promise(r=>setTimeout(r,20));
  const B=bridgeTree();const {tin,tout,pe,pn,sub,isBr,bAnc,pre}=B;
  const kids=new Map();for(const v of pre){if(!isBr[v])continue;const pb=bAnc[pn[v]];if(!kids.has(pb))kids.set(pb,[]);kids.get(pb).push(v);}
  const tops=(kids.get(-1)||[]).filter(v=>sub[v]>=T);
  const ok=new Uint8Array(NN);for(let i=0;i<NN;i++)ok[i]=NT[i]===0&&tin[i]>=0&&bAnc[i]===-1?1:0;
  const plans=[];
  for(const v0 of tops){let cur=v0,branch=false;for(;;){const hk=(kids.get(cur)||[]).filter(c=>sub[c]>=T);if(hk.length===1){cur=hk[0];continue;}branch=hk.length>1;break;}
    let best=null;const lo=tin[cur],hi=tout[cur];
    for(let k=lo;k<=hi;k++){const u=pre[k];if(u>=NN||NT[u]!==0)continue;
      const ci=Math.floor((X[u]-GX0)/CELL),cj=Math.floor((Y[u]-GY0)/CELL),rr=Math.ceil(maxLen/CELL);
      for(let j=cj-rr;j<=cj+rr;j++)for(let i=ci-rr;i<=ci+rr;i++){if(i<0||j<0||i>=GW||j>=GH)continue;const c=GRIDN[j*GW+i];for(let q=0;q<c.length;q++){const w=c[q];if(!ok[w])continue;const d=Math.hypot(X[w]-X[u],Y[w]-Y[u]);if(d>maxLen||d<5)continue;if(!best||d<best.d)best={u,w,d};}}}
    if(!best)continue;
    // 신설 후 남는 최대 단수: u의 조상 경로가 아닌 가지관 사고
    let rem=0;for(let k=tin[v0];k<=tout[v0];k++){const c=pre[k];if(!isBr[c])continue;if(tin[c]<=tin[best.u]&&tin[best.u]<=tout[c])continue;rem=Math.max(rem,sub[c]);}
    const top=pe[v0];const dia=Math.max(100,Math.min(200,DIA[top]||100));
    plans.push({v0,top,u:best.u,w:best.w,d:best.d,len:Math.round(best.d*1.2),before:sub[v0],after:rem,branch,dia,dm:NET.dmas[DMA[best.u]]||NET.dmas[DMA[v0]]||"",dong:dongAt(X[best.u],Y[best.u])});}

    후보:sel.map((p,k)=>({순위:k+1,위치:(p.dm||"")+(p.dong?" ("+p.dong+")":""),사고시_단수_수도미터:p.before,신설후_최대단수:p.after,목표달성:p.after<T,
      신설관_연장_m:p.len,직선거리_m:Math.round(p.d),권장관경_mm:p.dia,연결:`절점 ${NET.nodes.id[p.u]} ↔ 절점 ${NET.nodes.id[p.w]}`,취약관로:linkName(p.top)})),
    안내:"연장은 직선거리×1.2 추정입니다. 실제 노선(하천·도로 횡단, 사유지)은 현장 확인이 필요합니다."};}
function planCut(p){const b=cutSet([p.top],[]).cutN;const s=new Uint8Array(NN);for(const i of b)s[i]=1;const opn=[];for(let l=0;l<NL;l++){if(INIT[l]!==0)continue;if(s[N1[l]]!==s[N2[l]])opn.push(l);}
  return {opn,cutN:opn.length?cutSet([p.top],opn).cutN:b};}

    if(f){const {cutN}=planCut(p);const s=new Uint8Array(NN);for(const i of cutN)s[i]=1;for(let l=0;l<NL;l++)if(s[N1[l]]||s[N2[l]])links.set(l,{c:"#ef8a17",w:2.2});}});

  const ns=[];ps.forEach((p,k)=>{if(focus<0||focus===k){ns.push(p.u,p.w);const {cutN}=planCut(p);for(const i of cutN)ns.push(i);}});if(ns.length)fitNodes(ns,60);redraw();}
async function toolPlanFlow(a){const k=Math.max(1,+a.rank||1)-1;const p=AI.plans&&AI.plans[k];if(!p)throw new Error("먼저 신설 후보를 찾아야 합니다 (plan_new_links)");
  const ok=await ensureEngine();if(!ok)throw new Error("이 기기에서 수리계산 엔진을 쓸 수 없습니다");aiNote(`신설안 ${k+1} 물 흐름 계산 중…`);

  // 신설관 끝 수압

  inputSchema:{type:"object",properties:{hour:{type:"number",description:"0~23, 생략 시 현재 기준시각"},prv_settings:{type:"array",items:{type:"object",properties:{id:{type:"string"},setting_m:{type:"number"}},required:["id","setting_m"]}},close_ids:{type:"array",items:{type:"string"}},open_ids:{type:"array",items:{type:"string"}}}},execute:i=>toolSimulate(i)},
 {name:"plan_new_links",description:"관로 하나가 사고로 끊기면 수도미터 min_meters개 이상이 단수되는 가지관 구역을 찾고, 그걸 막는 가장 짧은 비상연계 관로 신설 위치를 count개 골라 지도에 그린다(직선거리 기준).",
  inputSchema:{type:"object",properties:{min_meters:{type:"number"},count:{type:"number"},max_length_m:{type:"number",description:"신설관 최대 직선거리, 기본 800"}}},execute:i=>toolPlan(i)},
 {name:"show_plan_flow",description:"plan_new_links 결과 중 rank번째 안에 대해, 취약 관로 사고 시 신설 전/후를 EPANET으로 계산해 화면을 반으로 나눠 물 흐름을 보여준다.",inputSchema:{type:"object",properties:{rank:{type:"number"}},required:["rank"]},execute:i=>toolPlanFlow(i)}];
const AIRULES=`너는 K-water 광주수도지사 현장 직원이 쓰는 "광주 관망 모바일" 앱 안의 관망해석 도우미다. 앱에는 광주시 수리검토 관망(EPANET 2.2, 현재기준) 모델이 들어 있다.
규칙:
- 숫자는 반드시 도구 결과에서만 가져온다. 추측한 숫자를 만들지 않는다.
- 수압은 kgf/cm²로 말하고 필요하면 괄호에 m를 쓴다 (1 kgf/cm² ≈ 10 m). 최소 권장 수압은 1.5 kgf/cm²로 본다.
- 사용자가 "3키로", "3kg"처럼 말하면 3 kgf/cm² = 30 m로 바꿔 simulate에 넘긴다.
- 시뮬레이션 결과는 임시이며 사용자가 화면의 [저장]을 눌러야 저장된다고 짧게 알려준다.
- 답은 한국어로 짧게: 결론 먼저, 근거 숫자 2~4줄, 필요하면 다음 할 일 한 줄. 마크다운 표·제목은 쓰지 말고 **굵게** 정도만 쓴다.
- 신설 관로 후보는 직선거리 추정이므로 현장 노선 확인이 필요하다고 덧붙인다.
- 도구로 할 수 없는 일은 할 수 없다고 말한다.`;

/* ---- 간이 분석(Claude 연결 없을 때) ---- */
function parsePress(s){const m=s.match(/(\d+(?:\.\d+)?)\s*(kgf\/?cm2|kgf\/?cm²|kgf|키로|kg|k|m|미터|바|bar)?/i);if(!m)return null;let v=+m[1];const u=(m[2]||"").toLowerCase();
  if(/^(m|미터)$/.test(u))return v;if(/kg|키로|^k$/.test(u))return v*10;if(/바|bar/.test(u))return v*10.2;return v<=10?v*10:v;}
async function localAnswer(q){const s=q.replace(/\s+/g," ");const sel=SELN[0];
  if(/비상\s*연계|신설|연계\s*관|연결\s*관/.test(s)&&/설치|신설|후보|어디|선정|만들/.test(s)){
    const m=s.match(/(\d+)\s*개\s*(이상|넘)/);const c=s.match(/(\d+)\s*(군데|곳|개소|개\s*안)/);const r=await toolPlan({min_meters:m?+m[1]:300,count:c?+c[1]:3});
    if(!r.후보.length)return `조건(단일 관로 사고 시 ${m?m[1]:300}개 이상 단수)에 해당하는 구역이 없거나, 800 m 안에 연결할 관망이 없습니다.`;
    let t=`관로 하나가 끊기면 기존 경계밸브를 열어도 수도미터 **${m?m[1]:300}개 이상** 단수되는 구역이 ${r.해당_구역수}곳 있습니다. 신설관이 가장 짧은 ${r.후보.length}곳입니다.\n`;
    r.후보.forEach(p=>{t+=`\n**${p.순위}안 ${p.위치}** · 신설 약 ${p.신설관_연장_m} m (D${p.권장관경_mm})\n  사고 시 단수 ${fmt(p.사고시_단수_수도미터)}개 → 신설 후 최대 ${fmt(p.신설후_최대단수)}개${p.목표달성?"":" (목표 미달)"}`;});
    t+=`\n\n${r.안내}\n아래 [신설안 흐름 보기]로 사고 시 신설 전/후 물 흐름을 볼 수 있습니다.`;
    if(/흐름|보여/.test(s)){try{const f=await toolPlanFlow({rank:1});t+=`\n\n1안 흐름: 단수 ${fmt(f.단수_수도미터_신설전)}개 → ${fmt(f.단수_수도미터_신설후)}개, 신설관 유량 약 ${f.신설관_유량_m3h} m³/h.`;}catch(e){}}
    return t;}
  const isPrv=sel&&sel.t==="l"&&LT[sel.i]===3;
  if(/감압|PRV|설정|토출/.test(s)||(isPrv&&/\d/.test(s)&&/바꾸|변경|조정|올리|내리|하면|맞춰/.test(s))){
    if(!isPrv)return "지도에서 감압밸브를 먼저 눌러 선택한 뒤 물어보세요. (예: 감압밸브를 길게 누르고 'AI에게 묻기')";
    const l=sel.i;const want=/바꾸|변경|조정|올리|내리|으로\s*하|로\s*하|하면|설정해|맞춰/.test(s)?parsePress(s):null;
    if(want==null){const sp=elemInfo(sel);return `**${linkName(l)}**의 설정압(토출압)은 **${(NET.links.set[l]/10).toFixed(2)} kgf/cm²** (${fmt(NET.links.set[l],0)} m)입니다.\n${hh2(HOUR)}:00 기준 상류 수압 ${sp["상류 수압"]}, 하류 수압 ${sp["하류 수압"]}.`;}
    const r=await toolSimulate({prv_settings:[{id:NET.links.id[l],setting_m:want}]});const c=r.변경[0];
    let t=`**${c.감압밸브}** 설정을 ${c.설정압_전} → **${c.설정압_후}**로 바꿔 계산했습니다 (${r.기준시각}).\n하류 수압 ${c.하류수압_전} → **${c.하류수압_후} kgf/cm²**`;
    if(r.수압이_바뀐_절점){t+=`\n수압이 바뀐 곳: 절점 ${fmt(r.수압이_바뀐_절점)}개, 수도미터 ${mtxt(r.해당_수도미터)}개`;
      if(r.수압_후_kgf)t+=`\n그 구역 최저 수압 ${r.수압_전_kgf.최저} → **${r.수압_후_kgf.최저} kgf/cm²**`;
      t+=`\n1.5 kgf/cm² 미만 수도미터 ${mtxt(r.수압부족_1점5미만_전.수도미터)} → **${mtxt(r.수압부족_1점5미만_후.수도미터)}개**`;}else t+="\n관망 수압에는 거의 변화가 없습니다 (하류 수압이 설정보다 낮아 밸브가 그대로 열려 있는 경우 등).";
    if(r.단수_수도미터)t+=`\n주의: 물이 끊기는 수도미터 ${fmt(r.단수_수도미터)}개`;
    return t+"\n\n임시 결과입니다. 남기려면 [저장]을 누르세요.";}
  if(/단수/.test(s)&&sel&&sel.t==="l"){const r=toolCut({});return `**${r.관로}**가 끊기면 수도미터 **${mtxt(r.단수_수도미터)}개**(절점 ${fmt(r.단수_절점)}개)가 단수됩니다.${r.영향_소블록.length?" 영향 소블록: "+r.영향_소블록.join(", "):""}`;}
  if(/수압|압력|유량|유속|관경|관종|제원/.test(s)&&sel){const o=elemInfo(sel);return `**${o.이름}** (${o.기준시각} 기준)\n`+Object.entries(o).filter(([k])=>!/이름|ID|기준시각|설정압_m|종류/.test(k)).map(([k,v])=>`${k}: ${v}`).join("\n");}
  return "간이 분석 모드에서는 이런 질문을 이해합니다.\n· \"300개 이상 단수 안 되게 비상연계 관로 신설 후보 3곳, 흐름도 보여줘\"\n· (감압밸브 선택 후) \"설정압 몇이야?\", \"3.0 kgf로 바꾸면?\"\n· (관로 선택 후) \"여기 수압·유량은?\", \"여기 끊기면 단수 몇 개?\"\n자유로운 질문은 claude.ai 안에서 열면 Claude가 답합니다.";}

function aiMd(t){return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");}
function aiNote(t){const k=AI.busy&&AI.log.length&&AI.log[AI.log.length-1].r==="a"?AI.log.length-1:AI.log.length;AI.log.splice(k,0,{r:"t",t});drawLog();}
function drawLog(){const el=$("#aiLog");if(!el)return;el.innerHTML=AI.log.map(m=>`<div class="msg ${m.r}">${m.r==="a"?aiMd(m.t||"생각 중…"):esc(m.t)}</div>`).join("");el.scrollTop=el.scrollHeight;
  const sb=$("#shBody");if(sb)sb.scrollTop=sb.scrollHeight;}
function renderScen(){const el=$("#aiScen");if(!el)return;const s=AI.scen;
  el.innerHTML=s?`<div class="opcard"><div class="ophead">임시 시뮬레이션 (저장 안 됨)</div><div style="font-size:13.5px">${esc(s.label)}</div><div class="actions" style="margin:8px 0 0"><button class="btn pri" id="aiSave">저장</button><button class="btn" id="aiDrop">취소</button></div></div>`:"";

function ctxLine(){const e=SELN[0];if(!e)return "";const nm=e.t==="l"?linkName(e.i):(NT[e.i]===1?resName(e.i):"절점 "+NET.nodes.id[e.i]);return nm;}
function openAI(){renderAI();}
function renderAI(){const mode=AI.sample?(AI.tools?"Claude 연결됨":"Claude 연결됨 (도구 미지원 → 간이 분석)"):AI.sample===undefined?"연결 확인 중…":"간이 분석 모드";

  openSheet("AI 분석",mode,`
   <div class="ailog" id="aiLog"></div>
   <div id="aiScen"></div>
   ${AI.plans&&AI.plans.length?`<div class="actions">${AI.plans.map((p,k)=>`<button class="btn mini" data-pf="${k}">신설안 ${k+1} 흐름 보기</button>`).join("")}<button class="btn mini" id="aiAll">후보 전체 보기</button></div>`:""}
   ${tgt?`<div class="aictx">대상: <b>${esc(tgt)}</b></div>`:""}
   <div class="aiin"><textarea id="aiQ" rows="2" placeholder="${tgt?"이 지점에 대해 물어보세요 (예: 설정압은? 3.0으로 바꾸면?)":"관망에 대해 물어보세요"}"></textarea>
    <button class="btn pri" id="aiGo">${AI.busy?"중지":"보내기"}</button></div>
   ${AI.log.length?"":`<div class="aiex">${["300개 이상 단수 안 되게 비상연계 관로 신설 후보 3곳 선정하고 흐름 보여줘","(감압밸브 선택 후) 설정압 몇으로 돼 있어?","(감압밸브 선택 후) 2.5 kgf로 바꾸면 하류 수압 충분해?","(관로 선택 후) 여기 끊기면 단수 몇 개야?"].map(t=>`<button class="btn mini" data-ex="${esc(t)}">${esc(t)}</button>`).join("")}</div>`}
   ${AI.sample?"":`<p class="note">이 화면은 Claude 연결 없이 정해진 질문 유형만 이해합니다. claude.ai에서 열면 Claude가 자유 질문에 답하고 같은 도구로 계산합니다.</p>`}
   ${saved.length?`<details class="alt"><summary>저장된 시뮬레이션 ${saved.length}개</summary><div class="tbl"><table><tbody>${saved.map((s,k)=>`<tr><td>${esc(s.label)}<br><span class="note num" style="margin:0">${new Date(s.t).toLocaleString("ko-KR")} · ${hh2(s.h)}:00</span></td><td style="white-space:nowrap"><button class="btn mini" data-sv="${k}">다시 보기</button> <button class="btn mini" data-sd="${k}">삭제</button></td></tr>`).join("")}</tbody></table></div></details>`:""}`,"half");
  drawLog();renderScen();const B=$("#shBody");
  B.querySelectorAll("[data-ex]").forEach(b=>b.onclick=()=>{$("#aiQ").value=b.dataset.ex.replace(/^\(.+?\)\s*/,"");$("#aiQ").focus();});
  B.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>runTool(()=>toolPlanFlow({rank:+b.dataset.pf+1})));
  $("#aiAll")&&($("#aiAll").onclick=()=>drawPlans(AI.plans,-1));
  B.querySelectorAll("[data-sv]").forEach(b=>b.onclick=()=>{const s=saved[+b.dataset.sv];if(s.kind==="sim")runTool(()=>toolSimulate({...s.args}));else if(s.plan){idIndex();const p={u:NIDX.get(String(s.plan.u)),w:NIDX.get(String(s.plan.w)),top:findLinkId(s.plan.top),len:s.plan.len,dia:s.plan.dia,dm:""};AI.plans=[p];runTool(()=>toolPlanFlow({rank:1}));}});
  B.querySelectorAll("[data-sd]").forEach(b=>b.onclick=()=>{saved.splice(+b.dataset.sd,1);store("aiSaved",saved);renderAI();});
  const q=$("#aiQ");q.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();$("#aiGo").click();}};
  $("#aiGo").onclick=()=>{if(AI.busy){AI.ctl&&AI.ctl.abort();return;}const t=q.value.trim();if(!t)return;q.value="";ask(t);};}
async function runTool(fn){try{AI.keepOV=true;const r=await fn();if(CUR==="ai")renderAI();return r;}catch(e){toast(e.message||String(e));}finally{AI.keepOV=false;}}
async function ask(text){AI.log.push({r:"u",t:text});const msg={r:"a",t:""};AI.log.push(msg);AI.busy=true;renderAI();
  const tgt=ctxLine();
  try{if(AI.sample&&AI.tools){AI.ctl=new AbortController();
      const ctx=`현재 기준시각 ${hh2(HOUR)}:00.`+(tgt?` 사용자가 지도에서 선택한 대상: ${tgt} (get_selection으로 제원 확인 가능).`:" 선택한 대상 없음.");
      AI.turns.push({role:"user",content:text});const turns=[{role:"user",content:AIRULES+"\n\n"+ctx},...AI.turns.slice(-8)];if(turns.length>1&&turns[1].role!=="user")turns.splice(1,1);
      const tools=AITOOLS.map(t=>({...t,execute:async(i)=>{AI.keepOV=true;try{return await t.execute(i||{});}finally{AI.keepOV=false;}}}));
      const res=await AI.sample(turns,{tools,signal:AI.ctl.signal,onText:({text})=>{msg.t=text;drawLog();}});
      msg.t=res.text;AI.turns.push({role:"assistant",content:res.text});}
    else{AI.keepOV=true;msg.t=await localAnswer(text);AI.keepOV=false;}}
  catch(e){AI.keepOV=false;const c=e&&e.code;if(c==="cancelled")msg.t=(e.text||"")+"\n(중지됨)";
    else if(c==="not_granted"||c==="sampling_disabled"||c==="tools_unavailable"||c==="capability_disabled"){AI.sample=null;msg.t=await localAnswer(text).catch(x=>"계산 중 오류: "+x.message);}
    else if(c==="rate_limited")msg.t=(e.text||"")+"\n요청이 많아 잠시 후 다시 시도하세요.";
    else if(c)msg.t=(e.text||"")+"\nClaude 응답 오류("+c+"). 다시 시도하세요.";
    else msg.t="계산 중 오류: "+(e.message||e);}
  AI.busy=false;AI.ctl=null;if(CUR==="ai")renderAI();}

/* ============ GIS 시설 레이어 (소화전·관말·제수밸브·신규관로) ============ */
let GF=null;
layers=Object.assign({gHyd:true,gEnd:true,gVal:false,gNew:false},layers);
const VOPN={SAE001:"열림",SAE002:"닫힘",SAE999:"기타"};
async function loadFac(){try{const buf=await fetchGz("fac.json.gz.txt");const o=JSON.parse(new TextDecoder().decode(buf));
  const P=a=>({x:a[0]/10,y:a[1]/10});
  GF={h:o.h.map(a=>({...P(a),cal:a[2],id:a[4]})),e:o.e.map(a=>({...P(a),cal:a[2],id:a[3]})),v:o.v.map(a=>({...P(a),cal:a[2],fom:a[3],op:a[4],id:a[5]})),
    np:o.np.map(a=>{const c=a[5];const pts=[];for(let i=0;i<c.length;i+=2)pts.push([c[i]/10,c[i+1]/10]);return {cls:a[0],dia:a[1],kind:a[2],yr:a[3],id:a[4],pts,closed:!!a[6]};})};
  // 이토 지점 추천에 실제 관말·소화전 연결
  FAC=[...GF.e.map(f=>({x:f.x,y:f.y,k:"관말(이토)",id:f.id})),...GF.h.map(f=>({x:f.x,y:f.y,k:"소화전",id:f.id}))];
  GF.grid=new Map();const put=(t,i,f)=>{const k=Math.floor(f.x/200)+","+Math.floor(f.y/200);if(!GF.grid.has(k))GF.grid.set(k,[]);GF.grid.get(k).push([t,i]);};
  GF.h.forEach((f,i)=>put("h",i,f));GF.e.forEach((f,i)=>put("e",i,f));GF.v.forEach((f,i)=>put("v",i,f));

  else if(WC.mode==="down"&&sc){OV=ovCut(sc.cutN,null,sc.closed,[]);const lg=[{c:css("--cut"),t:"단수 구역 (병물 공급 대상)"}];
    if(TP){OV.extra=TP.del.map(d=>({x1:TP.fill.x,y1:TP.fill.y,x2:d.x,y2:d.y,c:"#1565c0"}));OV.tags.push({x:TP.fill.x,y:TP.fill.y,kind:"n",c:"#1565c0",text:"충수 "+TP.fill.kind});TP.del.forEach((d,i)=>OV.tags.push({x:d.x,y:d.y,kind:"n",c:"#ef8a17",text:"급수 "+(i+1)}));lg.push({c:"#1565c0",t:"급수차 경로 (충수→급수, 직선)"});
      let a=1e18,b=1e18,c=-1e18,e=-1e18;for(const p of [TP.fill,...TP.del]){a=Math.min(a,p.x);c=Math.max(c,p.x);b=Math.min(b,p.y);e=Math.max(e,p.y);}for(const i of sc.cutN){a=Math.min(a,X[i]);c=Math.max(c,X[i]);b=Math.min(b,Y[i]);e=Math.max(e,Y[i]);}fit(a,b,c,e,50);}
    setLegend(lg);redraw();
    B.querySelectorAll("[data-tp]").forEach(x=>x.onclick=()=>flyTo(TP.fill.x,TP.fill.y,Math.max(view.s,0.6)));}
  if(noCut&&WC.mode==="up"){const n=document.createElement("div");n.className="callout good";n.textContent="선택한 곳이 끊겨도 단수되는 구역이 없어 병물 계산이 필요 없습니다. 아래는 배수지 전단 사고 계산입니다.";B.prepend(n);}}
function showCalcDetail(R,ctx){let m=$("#calcModal");if(!m){m=document.createElement("div");m.id="calcModal";m.className="modal";document.body.appendChild(m);}
  m.innerHTML=`<div class="mbox"><div class="mhd"><b>상세 계산내역</b><button class="xbtn" id="mClose" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
   <p class="note">${ctx.mode==="up"?`대상: ${esc(ctx.res)} — 배수지 전단 또는 배수지 사고로 배수지 유입이 끊긴 경우`:`대상: 배수지 후단 관로 사고 단수 구역 (공급 배수지 추정 ${esc(ctx.auto||"–")})`} · 가구 ${fmt(ctx.hh?ctx.hh.hh:0)} · 기준 ${hh2(HOUR)}:00</p>
   <div class="csteps">${R.S.map(s=>`<div class="cstep"><div class="ch"><span class="no">${s.no||"·"}</span><span class="lb">${esc(s.lab)}</span><b>${esc(typeof s.val==="number"?fmt(s.val,s.val%1?2:0):s.val)} ${esc(s.unit)}</b></div><div class="cf">식: ${esc(s.formula)}</div><div class="cf">대입: ${esc(s.sub)}</div>${s.note?`<div class="cn">${esc(s.note)}</div>`:""}</div>`).join("")}</div>
   ${R.trucks?`<div class="tbl"><table><thead><tr><th>투입 대수</th><th class="r">수급 횟수</th><th class="r">수급량</th><th>판정</th></tr></thead><tbody>${R.trucks.map(t=>`<tr><td>${t.k}대</td><td class="r">${t.trips}회</td><td class="r">${fmt(t.ton)} ton</td><td>${t.ton>=R.v6?"충분":"부족"}</td></tr>`).join("")}</tbody></table></div>`:""}
   ${SRCNOTE}</div>`;
  m.hidden=false;m.onclick=e=>{if(e.target===m)m.hidden=true;};$("#mClose").onclick=()=>m.hidden=true;}
</script>
</body></html>
